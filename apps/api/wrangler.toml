#:schema node_modules/wrangler/config-schema.json
name = "alkcloud-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
# workers.dev TẮT: production chỉ dùng route trên api.alk.xx.kg (D03).
preview_urls = false

# Route-based single Worker: ưu tiên trên custom domain của gateway cho đúng prefix.
# Routes có precedence cao hơn Custom Domain khi cùng hostname (VERIFIED qua docs).
# ⚠️ Thêm route này = thay đổi routing production — cần owner duyệt trước khi deploy.
routes = [
  { pattern = "api.alk.xx.kg/api/v1/*", zone_name = "alk.xx.kg" },
]

[observability]
enabled = true

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "alkcloud"
# D1 production đã tạo 13/11/2026 — uuid khớp với API
# GET /accounts/{id}/d1/database (không chứa secret).
database_id = "450d6f8c-39b9-4ab8-9180-583fc076070e"
migrations_dir = "migrations"

[vars]
ALKCLOUD_ALLOWED_ORIGINS = "https://cloud.alk.xx.kg"
ALKCLOUD_PUBLIC_URL = "https://cloud.alk.xx.kg"
ALKCLOUD_API_URL = "https://api.alk.xx.kg/api/v1"
ALKCLOUD_DAILY_API_BUDGET = "20000"
ALKCLOUD_ACCOUNT_DAILY_REQUEST_LIMIT = "100000"
ALKCLOUD_QUOTA_STATE_TTL_SECONDS = "60"
# Account id không phải bí mật (hiện trong URL dashboard) ⇒ để ở [vars].
CLOUDFLARE_ACCOUNT_ID = "c3f46654371899594a8ddf59b863d211"
# Hop workers.dev duy nhất tới B2 (Worker gắn route zone bị 525 khi fetch B2).
B2_RELAY_URL = "https://alkcloud-b2relay.alkev.workers.dev"
ENVIRONMENT = "production"

# Secrets (KHÔNG commit — đặt bằng `wrangler secret put <NAME>`):
#   AUTH_PEPPER                              ← đã set 13/11
#   BOOTSTRAP_SETUP_TOKEN                    ← đã set 13/11
#   CLOUDFLARE_ANALYTICS_TOKEN               ← đã set 13/11 (token read-only)
#   B2_ENDPOINT                              ← đã set 13/11
#   B2_REGION                                ← đã set 13/11
#   B2_BUCKET                                ← đã set 13/11
#   B2_ACCESS_KEY_ID                         ← đã set 13/11
#   B2_SECRET_ACCESS_KEY                     ← đã set 13/11
#   B2_RELAY_TOKEN                           ← đã set 13/11 (trùng secret của alkcloud-b2relay)
#   B2_MAINTENANCE_ACCESS_KEY_ID             ← BLOCKED (backup B2 qua rclone chưa cần)
#   B2_MAINTENANCE_SECRET_ACCESS_KEY         ← BLOCKED
#   TURNSTILE_SITE_KEY                       ← tùy chọn (Turnstile không bắt buộc ở server)
#   TURNSTILE_SECRET_KEY                     ← tùy chọn
#   ALERT_WEBHOOK_URL                        ← tùy chọn (chưa chọn kênh alert — B5)
