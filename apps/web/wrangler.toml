#:schema node_modules/wrangler/config-schema.json
name = "alkcloud-web"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Static assets: React SPA + trang chia sẻ tĩnh.
# ⚠️ deploy sẽ tạo Worker `alkcloud-web` — cần owner duyệt.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Route cho SPA (chưa có DNS `cloud.alk.xx.kg` — owner action required).
# routes = [
#   { pattern = "cloud.alk.xx.kg/*", zone_name = "alk.xx.kg" },
# ]

[observability]
enabled = true
