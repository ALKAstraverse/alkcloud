#:schema node_modules/wrangler/config-schema.json
name = "alkcloud-web"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Route cho SPA — domain `cloud.alk.xx.kg` (zone alk.xx.kg).
# Chỉ phủ domain của AlkCloud; KHÔNG đụng route nào của gateway hay service khác.
#
# ⚠️ `routes` phải đặt TRƯỚC mọi bảng TOML khác ([assets] ...) — nếu đặt sau,
# nó rơi vào bảng trước đó và wrangler báo "Unexpected fields found in assets
# field: routes" ⇒ deploy xong nhưng KHÔNG có target nào được deploy.
routes = [
  { pattern = "cloud.alk.xx.kg/*", zone_name = "alk.xx.kg" },
]

# Static assets: React SPA + trang chia sẻ tĩnh.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker PHẢI chạy trước khi phục vụ static asset. Mặc định (`false`) Cloudflare
# phục vụ `/` và `/assets/*` thẳng từ Static Assets ⇒ Worker không chạy ⇒ header
# security lấy từ `public/_headers` (dễ lệch với `src/worker.ts`) và redirect
# entry-point có version không bao giờ chạy.
run_worker_first = true

[observability]
enabled = true
